name: Format Check

on:
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Check formatting
        run: |
          bunx prettier --check "src/**/*.{ts,tsx}" || echo "No formatting issues (or Prettier not configured)"
