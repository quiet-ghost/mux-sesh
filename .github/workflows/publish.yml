name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Bump version (major, minor, patch)'
        required: true
        type: choice
        options:
          - major
          - minor
          - patch
      version:
        description: 'Override version (optional)'
        required: false
        type: string

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          all-platforms: true

      - name: Type check
        run: bun run typecheck

      - name: Bump version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
            npm version $VERSION --no-git-tag-version
          else
            VERSION=$(npm version ${{ inputs.bump }} --no-git-tag-version | sed 's/v//')
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "New version: $VERSION"

      # Bun cross-compiles every target from Linux; the native packages come from all-platforms.
      - name: Build platform binaries
        run: bun run build:all

      - name: Smoke test this runner's binary
        run: bun run smoke:binary --runs 1

      - name: Pack npm packages
        run: bun tools/build/pack.ts > dist/packed.txt

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock
          git commit -m "chore: release v${{ steps.version.outputs.version }}"
          git tag "v${{ steps.version.outputs.version }}"

      - name: Setup npm auth
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc

      # pack lists the platform packages first, so mux-sesh is published once its binaries exist.
      # Versions already on the registry are skipped: retry a failed run with the same `version` input.
      - name: Publish to npm
        run: |
          while read -r directory; do
            name="$(jq -r .name "$directory/package.json")"
            version="$(jq -r .version "$directory/package.json")"

            if npm view "$name@$version" version > /dev/null 2>&1; then
              echo "$name@$version is already published; skipping."
              continue
            fi

            npm publish "$directory"
          done < dist/packed.txt
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Push changes
        run: |
          git push origin ${{ github.ref_name }}
          git push --tags

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version.outputs.version }}
          release_name: Release v${{ steps.version.outputs.version }}
          body: |
            ## Release v${{ steps.version.outputs.version }}

            ### Installation

            ```bash
            # Install with npm
            npm install -g mux-sesh

            # Or with Bun
            bun install -g mux-sesh
            ```

            npm installs a prebuilt binary for Linux (x64, arm64; glibc or musl) or macOS (x64, arm64).
            Running mux-sesh needs neither Bun nor Node.

            ### Prerequisites

            - tmux, or Herdr 0.7.5 or newer
            - git (optional, for GitHub cloning)
          draft: false
          prerelease: false
