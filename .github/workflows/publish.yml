name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Bump version (major, minor, patch)'
        required: true
        type: choice
        options:
          - major
          - minor
          - patch
      version:
        description: 'Override version (optional)'
        required: false
        type: string

# id-token lets npm trusted publishing (OIDC) authenticate this workflow and sign provenance.
permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          all-platforms: true

      # Trusted publishing needs npm 11.5.1 or newer.
      - name: Setup Node and npm
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Update npm
        run: npm install -g npm@11

      - name: Type check
        run: bun run typecheck

      - name: Bump version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
            npm version $VERSION --no-git-tag-version
          else
            VERSION=$(npm version ${{ inputs.bump }} --no-git-tag-version | sed 's/v//')
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "New version: $VERSION"

      # A finished release has its tag and its mux-sesh package (published last). Stop before building
      # if either exists; a run that failed partway has neither, so it can be retried as is.
      - name: Check the version is free
        run: |
          version="${{ steps.version.outputs.version }}"

          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "::error::Tag v$version already exists. Choose another version in the 'version' input."
            exit 1
          fi

          if npm view "mux-sesh@$version" version > /dev/null 2>&1; then
            echo "::error::mux-sesh@$version is already on npm, and npm never reuses a version. Choose another version in the 'version' input."
            exit 1
          fi

      # Bun cross-compiles every target from Linux; the native packages come from all-platforms.
      - name: Build platform binaries
        run: bun run build:all

      - name: Smoke test this runner's binary
        run: bun run smoke:binary --runs 1

      - name: Pack npm packages
        run: bun tools/build/pack.ts > dist/packed.txt

      # Trusted publishing and provenance require each package to name this exact repository.
      - name: Check package repository URLs
        run: |
          expected="git+https://github.com/${{ github.repository }}.git"
          failed=0

          while read -r directory; do
            actual="$(jq -r '.repository.url // ""' "$directory/package.json")"

            if [ "$actual" != "$expected" ]; then
              echo "::error::$directory/package.json repository.url is '$actual', expected '$expected'."
              failed=1
            fi
          done < dist/packed.txt

          exit "$failed"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock
          git commit -m "chore: release v${{ steps.version.outputs.version }}"
          git tag "v${{ steps.version.outputs.version }}"

      # pack lists the platform packages first, so mux-sesh is published once its binaries exist.
      # Versions already on the registry are skipped: retry a failed run with the same `version` input.
      # npm authenticates with trusted publishing (OIDC): every package trusts this workflow, so no
      # token is stored. Provenance is signed for each package.
      - name: Publish to npm
        run: |
          while read -r directory; do
            name="$(jq -r .name "$directory/package.json")"
            version="$(jq -r .version "$directory/package.json")"

            if npm view "$name@$version" version > /dev/null 2>&1; then
              echo "$name@$version is already published; skipping."
              continue
            fi

            npm publish "$directory" --provenance --access public
          done < dist/packed.txt

      - name: Push changes
        run: |
          git push origin ${{ github.ref_name }}
          git push --tags

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version.outputs.version }}
          release_name: Release v${{ steps.version.outputs.version }}
          body: |
            ## Release v${{ steps.version.outputs.version }}

            ### Installation

            ```bash
            # Install with npm
            npm install -g mux-sesh

            # Or with Bun
            bun install -g mux-sesh
            ```

            npm installs a prebuilt binary for Linux (x64, arm64; glibc or musl) or macOS (x64, arm64).
            Running mux-sesh needs neither Bun nor Node.

            ### Prerequisites

            - tmux, or Herdr 0.7.5 or newer
            - git (optional, for GitHub cloning)
          draft: false
          prerelease: false
