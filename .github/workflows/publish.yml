name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Bump version (major, minor, patch)'
        required: true
        type: choice
        options:
          - major
          - minor
          - patch
      version:
        description: 'Override version (optional)'
        required: false
        type: string

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Type check
        run: bun run typecheck

      - name: Bump version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
            npm version $VERSION --no-git-tag-version
          else
            VERSION=$(npm version ${{ inputs.bump }} --no-git-tag-version | sed 's/v//')
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "New version: $VERSION"

      - name: Build
        run: bun run build

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock
          git commit -m "chore: release v${{ steps.version.outputs.version }}"
          git tag "v${{ steps.version.outputs.version }}"

      - name: Setup npm auth
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Push changes
        run: |
          git push origin ${{ github.ref_name }}
          git push --tags

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version.outputs.version }}
          release_name: Release v${{ steps.version.outputs.version }}
          body: |
            ## Release v${{ steps.version.outputs.version }}
            
            ### Installation
            
            ```bash
            # Install with Bun
            bun install -g mux-sesh
            
            # Or with npm
            npm install -g mux-sesh
            ```
            
            ### Prerequisites
            
            - [Bun](https://bun.sh) >= 1.0.0
            - [Zig](https://ziglang.org) (for building OpenTUI)
            - tmux
            - git (optional, for GitHub cloning)
          draft: false
          prerelease: false
