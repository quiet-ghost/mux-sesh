name: Test

on:
  pull_request:
  push:
    branches: 
      - main
      - opentui-convert

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun test || echo "No tests found (skipping)"
        # When you add tests, remove the "|| echo" part
