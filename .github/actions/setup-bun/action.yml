name: Setup Bun
description: Setup Bun with cache and install dependencies
inputs:
  all-platforms:
    description: Also install every platform's native packages, which cross-compiled binaries embed
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json

    - name: Get Bun cache directory
      id: cache
      shell: bash
      run: echo "dir=$(bun pm cache)" >> "$GITHUB_OUTPUT"

    - name: Cache Bun dependencies
      uses: actions/cache@v4
      with:
        path: ${{ steps.cache.outputs.dir }}
        key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-

    - name: Install dependencies
      shell: bash
      env:
        ALL_PLATFORMS: ${{ inputs.all-platforms }}
      run: |
        if [ "$ALL_PLATFORMS" = true ]; then
          bun install --frozen-lockfile --os='*' --cpu='*' --libc='*'
        else
          bun install --frozen-lockfile
        fi
